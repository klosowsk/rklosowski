name: Push Docker Image

on:
  push:
    branches:
      - main

concurrency:
  group: rklosowski-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v2
        with:
          node-version: "20"

      - name: Enable Corepack
        run: corepack enable

      - name: Install packages
        run: yarn install --immutable

      - name: Run lint
        run: yarn lint

      - name: Run type check
        run: yarn tsc

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            klosowsk/rklosowski:${{ env.TAG }}
            klosowsk/rklosowski:latest

      - name: Update k3s-homelab manifests (GitOps)
        env:
          K3S_HOMELAB_PAT: ${{ secrets.K3S_HOMELAB_PAT }}
        run: |
          set -euxo pipefail
          git clone --depth 1 \
            "https://x-access-token:${K3S_HOMELAB_PAT}@github.com/klosowsk/k3s-homelab.git" /tmp/k3s-homelab
          cd /tmp/k3s-homelab
          sed -i "s|image: klosowsk/rklosowski:.*|image: klosowsk/rklosowski:${TAG}|g" \
            argocd-apps/rklosowski/deployment.yaml
          if git diff --quiet; then
            echo "rklosowski image already points at ${TAG}"
            exit 0
          fi
          git config user.name "rklosowski-ci"
          git config user.email "ci@rklosowski.com"
          git add argocd-apps/rklosowski/deployment.yaml
          git commit -m "deploy: rklosowski ${TAG}"
          git push
